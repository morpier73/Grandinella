name: Build app

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: Prepara la chiave di firma definitiva (se configurata)
        env:
          KEYSTORE_BASE64: ${{ secrets.GRANDINELLA_KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "GRANDINELLA_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
      - name: Compila APK
        working-directory: android
        env:
          GRANDINELLA_KEYSTORE_PASSWORD: ${{ secrets.GRANDINELLA_KEYSTORE_PASSWORD }}
          GRANDINELLA_KEY_ALIAS: ${{ secrets.GRANDINELLA_KEY_ALIAS }}
          GRANDINELLA_KEY_PASSWORD: ${{ secrets.GRANDINELLA_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon
      - run: cp android/app/build/outputs/apk/release/app-release.apk Grandinella-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Grandinella-Android
          path: Grandinella-Android.apk

  ios:
    needs: test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx cap sync ios
      - name: Compila l'app iOS senza firma
        working-directory: ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build
      - name: Impacchetta IPA non firmato
        run: |
          mkdir -p Payload
          cp -R ios/App/build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qry Grandinella-iOS-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Grandinella-iOS
          path: Grandinella-iOS-unsigned.ipa

  release:
    if: github.event_name != 'pull_request'
    needs: [android, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Pubblica la release "ultima"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete ultima --yes --cleanup-tag || true
          gh release create ultima Grandinella-Android.apk Grandinella-iOS-unsigned.ipa \
            --target "$GITHUB_SHA" --title "Grandinella – ultima build" \
            --notes "Build automatica del commit $GITHUB_SHA. Android: scarica l'APK dal telefono e installalo. iOS: IPA non firmato, da installare con Sideloadly e un Apple ID."
